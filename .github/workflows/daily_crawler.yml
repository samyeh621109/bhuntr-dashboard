name: BHuntr 自動爬蟲與網頁更新

on:
  schedule:
    # 每天台灣時間 AM 08:00 (UTC 00:00) 定時自動執行
    - cron: '0 0 * * *'
  workflow_dispatch: # 支援手動一鍵點擊執行

permissions:
  contents: write

jobs:
  crawl-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出專案程式碼
        uses: actions/checkout@v3

      - name: 設定 Python 環境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 安裝相依套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 執行 BHuntr 賽事爬蟲與網頁生成
        run: |
          # 每天自動爬取前 10 頁（約 240 筆最新賽事），並更新 index.html 與 JSON 資料庫
          python3 main.py --pages 10 --sort prize --export full_contests.json

      - name: 自動提交變更並發布到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
